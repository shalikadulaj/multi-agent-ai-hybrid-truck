[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-ai"
version = "0.1.0"
description = "Research prototype for Q-learning hybrid heavy-truck energy management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"numpy>=1.26",
	"matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
